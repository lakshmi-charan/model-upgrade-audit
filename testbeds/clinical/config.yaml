# Clinical testbed (MedAgentBench FHIR tasks + CAVE stress suite), adapted for the model-migration study.
fhir_api_base: "http://localhost:18080/fhir/"   # overridden by runtime.json when an existing container is reused
now: "2023-11-13T10:15:00+00:00"
output_dir: runs_unused
seed: 7
max_round: 8
compact_responses: true
max_response_chars: 12000      # reduced from 30000 to bound cost; identical for every model
verifier_response_chars: 6000
agents: []
fhir_timeout: 60
stress:                      # identical to the original CAVE stress-suite parameters (needed to rebuild the setup)
  n_per_hazard: 15
  control_fraction: 0.33
  n_per_unfamiliar: 15
  readonly_pool: 30

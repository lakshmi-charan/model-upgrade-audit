# Candidate models. Prices are USD per 1M tokens from the OpenRouter catalogue (2026-10-06); OpenRouter's
# reported per-call cost is used when present. Free providers (gemini, groq) cost 0.
# "family" + "order" define the old -> new upgrade chains studied (pairs are consecutive members).
# reasoning: low = cheapest reasoning setting where the model supports it; off = disabled; omitted = model default.
models:
  # ---- OpenAI small models: the provider's own official retirement replacements (deprecations page)
  - {label: gpt-4.1-nano,  provider: openrouter, model: openai/gpt-4.1-nano,  family: openai-small, order: 1, price_in: 0.10, price_out: 0.40, provider_order: [OpenAI], allow_fallbacks: false}
